# Ambiente local: apenas dependências. API, web e worker rodam com `pnpm dev`.
#   docker compose -f infrastructure/compose/dev.yml up -d
name: sci-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SCI_DB_NAME: sci_dev
      SCI_DB_OWNER_PASSWORD: sci_owner_dev
      SCI_DB_APP_PASSWORD: sci_app_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/db-bootstrap.sql:/bootstrap/db-bootstrap.sql:ro
      - ../docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-sci.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
