name: Release images
# Publica imagens no GHCR a partir de tags vX.Y.Z (em main) ou de develop (homologação).
# O deploy em si é feito no servidor com infrastructure/scripts/deploy.sh;
# produção exige aprovação manual no environment "production".
on:
  push:
    tags: ["v*.*.*"]
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Versão
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "env=production" >> "$GITHUB_OUTPUT";
          else echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; echo "env=staging" >> "$GITHUB_OUTPUT"; fi
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/node.Dockerfile
          build-args: APP=api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sci-api:${{ steps.v.outputs.version }}
      - name: Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/node.Dockerfile
          build-args: APP=worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sci-worker:${{ steps.v.outputs.version }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Extensão Scale Assistant (zip)
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@sci/extension...
          (cd apps/extension && SCI_API_URL="${{ vars.PUBLIC_API_URL }}" SCI_WEB_URL="${{ vars.PUBLIC_APP_URL }}" node build.mjs)
          (cd apps/extension/dist && zip -r "../../../scale-assistant-${{ steps.v.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: scale-assistant-${{ steps.v.outputs.version }}
          path: scale-assistant-*.zip
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
            NEXT_PUBLIC_EXTENSION_IDS=${{ vars.EXTENSION_IDS }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sci-web:${{ steps.v.outputs.version }}-${{ steps.v.outputs.env }}
